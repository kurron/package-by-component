databaseChangeLog:
  - preConditions:
      - onFail: HALT
      - dbms:
          type: postgresql
  - changeSet:
      id: assets-001
      author: rkurr@jvmguy.com
      comment: Creation of schema
      labels: asset
      context: asset
      changes:
        - sql:
            comment: Liquibase doesn't have a schema creation statement so we do it by hand
            sql: CREATE SCHEMA IF NOT EXISTS asset
  - changeSet:
      id: assets-002
      author: rkurr@jvmguy.com
      comment: Initial armor table
      labels: assets
      context: assets
      changes:
        - createTable:
            schemaName: asset
            remarks: Armor descriptions
            tableName: armor
            columns:
              - column:
                  name: id
                  type: int
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: armor-pk
                    nullable: false
              - column:
                  name: version
                  type: int
                  remarks: optimistic locking
                  constraints:
                    nullable: false
                    validateNullable: true
              - column:
                  name: type
                  type: varchar(64)
                  remarks: type of armor
                  constraints:
                    nullable: false
                    validateNullable: true
              - column:
                  name: damage_resistance
                  type: int
                  remarks: amount of protection offered
                  constraints:
                    nullable: false
                    validateNullable: true
              - column:
                  name: cost
                  type: int
                  remarks: cost, in world currency, to purchase
                  constraints:
                    nullable: false
                    validateNullable: true
              - column:
                  name: weight
                  type: int
                  remarks: weight, in world measures
                  constraints:
                    nullable: false
                    validateNullable: true
              - column:
                  name: created_by
                  type: varchar(64)
                  remarks: auditing
                  constraints:
                    nullable: false
                    validateNullable: true
              - column:
                  name: created_on
                  type: datetime
                  remarks: auditing
                  constraints:
                    nullable: false
                    validateNullable: true
              - column:
                  name: modified_by
                  type: varchar(64)
                  remarks: auditing
                  constraints:
                    nullable: false
                    validateNullable: true
              - column:
                  name: modified_on
                  type: datetime
                  remarks: auditing
                  constraints:
                    nullable: false
                    validateNullable: true
